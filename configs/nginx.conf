server {
    listen 80;
    server_name _; # Accepts any IP address or domain name

    # Route backend API and Media requests to Django Gunicorn
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    
    location /media/ {
        alias /opt/grc-appliance/grc-backend/media/;
    }

    # Route all frontend UI requests to the Next.js standalone server
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
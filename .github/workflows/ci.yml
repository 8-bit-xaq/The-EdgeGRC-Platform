name: CI

on:
  pull_request:
    branches: [alpha, beta, main]
  push:
    branches: [alpha, beta, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grc-backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: grc-backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libmagic1

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Django configuration
        run: python manage.py check
        env:
          DJANGO_DEBUG: "True"

      - name: Check migration consistency
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_DEBUG: "True"

      - name: Run Django tests
        run: python manage.py test
        env:
          DJANGO_DEBUG: "True"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grc-frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: grc-frontend/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
